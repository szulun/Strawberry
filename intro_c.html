<style>
/* Same tokens as index.html, so the two pages read as one app. */
:root {
  --bg: #E9F5EE; --surface: #FFFFFF; --ink: #16251E; --muted: #52645A; --line: rgba(22,37,30,.11);
  --coral: #E5484D; --coral-shadow: #B3333A; --gold: #F6C343; --on-gold: #16251E;
  --blue: #2F6B4F; --table: #1D4A37; --header: #2F6B4F; --pink-soft: #FDE7EA;
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1C16; --surface: #182920; --ink: #EAF2EC; --muted: #9DB3A6; --line: rgba(255,255,255,.12);
  --coral: #EF5D63; --coral-shadow: #9E2E35; --blue: #3E8A66; --table: #10291F; --header: #1E4A37;
  --pink-soft: #3A2428; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1C16; --surface: #182920; --ink: #EAF2EC; --muted: #9DB3A6; --line: rgba(255,255,255,.12);
  --coral: #EF5D63; --coral-shadow: #9E2E35; --blue: #3E8A66; --table: #10291F; --header: #1E4A37;
  --pink-soft: #3A2428; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
.page { min-height: 100%; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { width: 100%; max-width: 560px; margin: 0 auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }

/* Header: identical to index. */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--header); color: #fff; }
header .col { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.mark { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.mark .berry { display: inline-block; transition: transform .2s; }
.mark:hover .berry { transform: rotate(-14deg) scale(1.15); }
.skip { min-height: 44px; padding: 0 4px; border: 0; background: none; color: rgba(255,255,255,.8); font-size: 14px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
.skip:hover { color: #fff; }
.skip.ready { padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,.18); color: #fff; }

main { flex: 1; padding-top: 24px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }

.progress { display: flex; gap: 6px; }
.progress span { height: 8px; flex: 1; border-radius: 999px; background: var(--surface); transition: background .2s; }
.progress span.done { background: var(--coral); }
.progress span.now { background: var(--gold); }

/* Opening shot: start close on the left, pull back to the four of them. */
.scene { border-radius: 24px; overflow: hidden; border: 1px solid var(--line); background: var(--table); }
.scene img { width: 100%; height: auto; display: block; image-rendering: pixelated; transform-origin: 0% 55%; }
.scene.panning img { animation: pan 2.8s cubic-bezier(.55,0,.25,1) both; }
.scene.gone { display: none; }

/* Speech bubble: tail points at whoever is talking. */
.bubble {
  --x: 50%;
  position: relative; width: 100%; text-align: left; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px;
  padding: 16px 20px 18px; box-shadow: 0 6px 0 var(--line);
  display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px;
}
.bubble.wait { visibility: hidden; }
.bubble:active { transform: translateY(2px); }
.bubble::after {
  content: ""; position: absolute; bottom: -12px; left: calc(var(--x) - 11px);
  width: 22px; height: 22px; background: var(--surface);
  border-right: 2px solid var(--line); border-bottom: 2px solid var(--line);
  transform: rotate(45deg); transition: left .3s cubic-bezier(.3,1.4,.5,1);
}
.bubble.all::after { opacity: 0; }
.who { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; border-radius: 999px; padding: 4px 12px; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.who .mini { width: 22px; height: 22px; border-radius: 50%; margin-left: -6px; background: rgba(255,255,255,.3); object-fit: cover; object-position: 50% 18%; image-rendering: pixelated; }
.line { display: block; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.15; min-height: 2.4em; text-wrap: balance; }
.hint { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.caret { display: inline-block; animation: bob 1s ease-in-out infinite; }
.sticker { position: absolute; top: -18px; right: -6px; font-size: 34px; transform: rotate(8deg); animation: stick .45s cubic-bezier(.3,1.6,.5,1) both; pointer-events: none; }

/* The table, with one empty seat. */
.table { background: var(--table); border-radius: 24px; padding: 22px 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 8px 0 var(--line); }
.crew { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.seat { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.av { --s: 52px; width: var(--s); height: var(--s); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: #fff; border: 3px solid rgba(255,255,255,.18); }
.av.face { position: relative; border: 0; overflow: hidden; }
.av.face img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 18%; display: block;
  image-rendering: pixelated;
}
.name { color: rgba(255,255,255,.8); font-size: 12px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chair { width: 72px; height: 72px; border-radius: 50%; border: 3px dashed var(--gold); display: flex; align-items: center; justify-content: center; font-size: 32px; animation: glow 1.6s ease-in-out infinite; }
.av.you-in { --s: 72px; font-size: 32px; }
.seat.empty .name { color: var(--gold); font-size: 15px; font-weight: 700; }
.seat.wait .av, .seat.wait .name { opacity: 0; }
.seat.in .av { animation: arrive .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay: var(--d); }
.seat.in .name { animation: fade .3s ease-out both; animation-delay: var(--d); }
.talk { animation: hop .36s ease-in-out infinite; }
.cheer { animation: hop .36s ease-in-out 3; }
.you-in { animation: pop .45s cubic-bezier(.3,1.6,.5,1) both; }

.actions { display: flex; flex-direction: column; gap: 12px; animation: rise .35s ease-out both; }
.btn { width: 100%; min-height: 56px; border-radius: 16px; padding: 14px 20px; font-size: 18px; font-weight: 600; transition: transform .1s; }
.btn:active { transform: translateY(2px) scale(.98); }
.btn-main { border: 0; background: var(--coral); color: #fff; box-shadow: 0 4px 0 var(--coral-shadow); }
.btn-ghost { border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.btn[disabled] { opacity: .6; }

/* Ending: what happens next. Same layout as index's welcome card. */
main.ended .progress, main.ended .scene, main.ended .bubble, main.ended .actions { display: none; }
.summary { display: flex; flex-direction: column; gap: 16px; animation: rise .45s cubic-bezier(.3,1.2,.5,1) both; }
.summary h2 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1.05; text-wrap: balance; }
.summary .sub { margin: 0; font-size: 18px; color: var(--muted); }
.steps { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 6px 18px; }
.step { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
.step + .step { border-top: 1px solid var(--line); }
.step .ic { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: var(--pink-soft); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.step b { display: block; font-size: 17px; line-height: 1.2; }
.step span { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; }
.fine { margin: -4px 0 0; text-align: center; font-size: 13px; color: var(--muted); }
.again { align-self: center; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; }
.again:hover { color: var(--ink); }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }
.confetti span { position: absolute; top: 0; font-size: 26px; }

@keyframes pan { 0%, 28% { transform: scale(2.1); } 100% { transform: scale(1); } }
@keyframes arrive { 0% { transform: translateY(-70px) scale(.3); opacity: 0; } 60% { transform: translateY(4px) scale(1.08); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bob { 50% { transform: translateY(3px); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px) rotate(-5deg); } }
@keyframes glow { 50% { box-shadow: 0 0 0 7px rgba(246,195,67,.22); } }
@keyframes stick { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(8deg); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 380px) {
  .line { font-size: 23px; }
  .av { --s: 48px; }
  .av.you-in { --s: 64px; }
  .chair { width: 64px; height: 64px; font-size: 28px; }
  .table { padding-inline: 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

// Left to right, same order as the photo. The empty seat sits under them.
const CREW = ["nicolas", "matteo", "zoey", "nicole"];
const LINES = [
  { who: "nicole",  text: "Hi. We're Nicole, Matteo, Nicolas, and Zoey." },
  { who: "matteo",  text: "Most days you pass people and never sit down." },
  { who: "nicolas", text: "So we sit down once, for one activity." },
  { who: "zoey",    text: "We kept this seat for you." },
];
const NEXT = "index.html?intro=1";
const SPEED = 28; // ms per character
const HOLD = 1300; // pause after a line, then the next one starts on its own
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const main = $("main"), scene = $("scene"), bubble = $("bubble"), whoEl = $("who"), lineEl = $("line");
const hint = $("hint"), actions = $("actions"), table = $("table");
const skipBtn = $("skip");

// phase: opening → talk → choice → seated → end
let openings = 0;
let phase = "opening", i = 0, typing = false, stamp = 0, raf = 0, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearLater = () => { timers.forEach(clearTimeout); timers = []; };

function buildTable(waiting) {
  table.innerHTML = "";
  const crew = document.createElement("div");
  crew.className = "crew";
  CREW.forEach((key, k) => {
    const p = CAST[key];
    const seat = document.createElement("div");
    seat.className = waiting ? "seat wait" : "seat";
    seat.style.setProperty("--d", `${k * 0.16}s`);
    seat.innerHTML = `<div class="av face" data-who="${key}" style="background:${p.color}"><img src="${p.face}" alt="${p.name}"></div>`;
    crew.appendChild(seat);
  });
  const empty = document.createElement("div");
  empty.className = "seat empty";
  empty.id = "empty";
  empty.innerHTML = `<div class="chair" aria-hidden="true">🪑</div><span class="name">You?</span>`;
  table.appendChild(crew);
  table.appendChild(empty);
}
function fillSeat() {
  const seat = $("empty");
  if (!seat) return;
  seat.className = "seat";
  seat.removeAttribute("id");
  seat.innerHTML = `<div class="av you-in" style="background:#FDB515;color:#1B1B3A">Y</div><span class="name">You</span>`;
}

// ---- Opening: camera pulls back, then the four hop into their seats.
function startOpening() {
  phase = "opening";
  skipBtn.classList.remove("ready");
  buildTable(!reduce && sceneOk);
  bubble.classList.add("wait");
  if (reduce || !sceneOk) { finishOpening(); return; }
  const img = $("img");
  const ready = img.complete ? Promise.resolve() : (img.decode ? img.decode() : Promise.resolve());
  const run = ++openings;
  ready.catch(() => {}).then(() => {
    if (phase !== "opening" || run !== openings) return;
    scene.classList.remove("panning");
    void scene.offsetWidth; // restart the animation on replay
    scene.classList.add("panning");
    later(() => {
      table.querySelectorAll(".seat.wait").forEach((s) => { s.classList.remove("wait"); s.classList.add("in"); });
      later(finishOpening, 1200);
    }, 2300);
  });
}
function finishOpening() {
  if (phase !== "opening") return;
  clearLater();
  scene.classList.remove("panning");
  table.querySelectorAll(".seat.wait, .seat.in").forEach((s) => s.classList.remove("wait", "in"));
  bubble.classList.remove("wait");
  phase = "talk";
  i = 0;
  startLine();
}

// ---- Dialogue
function setSpeaker(who) {
  whoEl.hidden = false;
  whoEl.innerHTML = `<img src="${CAST[who].face}" alt="" class="mini">${CAST[who].name}`;
  whoEl.style.background = CAST[who].color;
  bubble.classList.remove("all");
  bubble.style.setProperty("--x", `${((CREW.indexOf(who) + 0.5) / CREW.length) * 100}%`);
}
function setTalking(on) {
  const who = LINES[i].who;
  table.querySelectorAll(".av[data-who]").forEach((el) => {
    el.classList.toggle("talk", on && (who === "all" || el.dataset.who === who));
  });
}
function showChoice() {
  if (phase !== "talk") return;
  phase = "choice";
  hint.hidden = true;
  actions.hidden = false;
  $("sit").focus();
}
function goNext() {
  if (phase !== "talk") return;
  if (i >= 1) skipBtn.classList.add("ready");
  if (i < LINES.length - 1) { i += 1; startLine(); return; }
  showChoice();
}
function tick(now) {
  const full = LINES[i].text;
  const n = Math.min(full.length, Math.floor((now - stamp) / SPEED));
  lineEl.textContent = full.slice(0, n);
  if (n >= full.length) {
    typing = false;
    setTalking(false);
    later(goNext, HOLD);
    return;
  }
  raf = requestAnimationFrame(tick);
}
function startLine() {
  cancelAnimationFrame(raf);
  clearLater();
  setSpeaker(LINES[i].who);
  if (reduce) {
    lineEl.textContent = LINES[i].text;
    typing = false;
    later(goNext, HOLD);
    return;
  }
  typing = true;
  setTalking(true);
  stamp = performance.now();
  raf = requestAnimationFrame(tick);
}
function advance() {
  if (phase === "opening") { finishOpening(); return; }
  if (phase !== "talk") return;
  clearLater();
  if (typing) {
    cancelAnimationFrame(raf);
    typing = false;
    setTalking(false);
    lineEl.textContent = LINES[i].text;
    later(goNext, 400);
    return;
  }
  goNext();
}

// ---- Taking the seat
function confetti() {
  if (reduce) return;
  const box = $("confetti");
  const bits = ["🍓", "🍓", "🍓", "✨", "🎉"];
  for (let k = 0; k < 22; k++) {
    const el = document.createElement("span");
    el.textContent = bits[k % bits.length];
    el.style.left = `${Math.random() * 100}vw`;
    box.appendChild(el);
    const drift = (Math.random() - 0.5) * 160;
    el.animate(
      [{ transform: "translate(0,-10vh) rotate(0deg)" }, { transform: `translate(${drift}px,110vh) rotate(${(Math.random() - 0.5) * 720}deg)` }],
      { duration: 1100 + Math.random() * 700, delay: Math.random() * 200, easing: "cubic-bezier(.25,.6,.45,1)", fill: "forwards" }
    ).onfinish = () => el.remove();
  }
}
function sit() {
  if (phase !== "choice") return;
  phase = "seated";
  fillSeat();
  table.querySelectorAll(".av[data-who]").forEach((el) => el.classList.add("cheer"));
  whoEl.hidden = true;
  bubble.classList.add("all");
  lineEl.textContent = "There you are!";
  actions.hidden = true;
  confetti();
  later(enterApp, HOLD);
}
function replay() {
  clearLater();
  cancelAnimationFrame(raf);
  skipBtn.hidden = false;
  actions.hidden = true;
  hint.hidden = true;
  $("sit").hidden = false;
  $("sit").disabled = false;
  $("again").disabled = false;
  whoEl.hidden = false;
  lineEl.textContent = "";
  i = 0;
  startOpening();
  try { window.scrollTo(0, 0); } catch (e) {}
}

let sceneOk = true;
function dropScene() {
  sceneOk = false;
  scene.classList.add("gone");
  if (phase === "opening") finishOpening();
}
const imgEl = $("img");
imgEl.addEventListener("error", dropScene);
if (imgEl.complete && imgEl.naturalWidth === 0) dropScene();
bubble.addEventListener("click", advance);
main.addEventListener("click", (e) => { if (phase === "opening" && !e.target.closest("button")) finishOpening(); });
const enterApp = () => location.replace(NEXT);
document.querySelector(".mark").addEventListener("click", (e) => { e.preventDefault(); enterApp(); });
skipBtn.addEventListener("click", enterApp);
$("sit").addEventListener("click", sit);
$("again").addEventListener("click", replay);
// Enter/Space advances unless a button already has focus (buttons handle those keys).
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
  e.preventDefault();
  advance();
});
startOpening();
</script>
</body>
</html>
