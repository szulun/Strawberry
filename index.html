const FLOW = ["reveal", "intros", "meeting1", "after1", "between", "meeting2", "checkin"];
const JOURNEY = [
  { key: "reveal", group: "Before meeting 1", title: "Your group", emoji: "👋" },
  { key: "intros", group: "Before meeting 1", title: "Before you meet", emoji: "💬" },
  { key: "meeting1", group: "Meeting 1", title: "Meeting 1", emoji: "🧋" },
  { key: "after1", group: "Meeting 2", title: "Plan meeting 2", emoji: "🗓️" },
  { key: "between", group: "Meeting 2", title: "Meeting 2", emoji: "🧺" },
  { key: "checkin", group: "Meeting 2", title: "Check-in", emoji: "📝" },
  { key: "plan3", group: "Meeting 3", title: "Plan meeting 3", emoji: "🎤" },

function flowAt(stage) {

  const i = FLOW.indexOf(key);

function journeyAt(key) {

}

  if (key === "after1") return "After meeting 1";
  if (key === "between") return state.meet2Fixed ? "After you plan it" : "Set when two people are in";
  if (key === "checkin") return "After meeting 2";

function daysAway(iso) {

function meetingsOf(state) {

  else if (inNav && tab === "schedule") screen = <Schedule state={state} personas={personas} session={session} onPack={onPack} onReview={(key) => { setReview(key); setTab("table"); scrollTop(); }} onOpen={(stage) => { setReview(""); setTab("table"); go(stage); }} />;
  else if (inNav && review && stepState(review, state.stage) === "done") screen = <LookBack step={review} state={state} personas={personas} game={game} />;
  else if (state.stage === "seats") screen = <YourSeats userToken={(account && account.token) || ""} onBack={() => go(session ? "reveal" : "gate")} onHost={session ? null : () => go("gate")} />;
  else if (state.live && state.stage === "gate") screen = <LiveGate initialCode={roomFromUrl()} onJoined={join} onAccount={setAccount} />;
  else if (state.stage === "onboarding") screen = <Onboarding onDone={(a, h, standing, hook) => { update((s) => ({ answers: a, home: h, standing, hook, stage: "reveal", m1: {}, vote: null, slot: null, poked: false, run: s.run + 1 })); scrollTop(); }} />;
  else if (state.stage === "reveal") screen = <GroupReveal {...props} />;
  else if (state.stage === "intros") screen = <CrewChat {...props} />;
  else if (state.stage === "meeting1") screen = <Meeting1 {...props} session={session} />;
  else if (state.stage === "after1") screen = <AfterMeeting1 {...props} />;
  else if (state.stage === "between") screen = <BetweenMeetings {...props} />;
  else if (state.stage === "meeting2") screen = <Meeting2 {...props} />;
  else screen = <CheckIn game={game} personas={personas} live={!!state.live} code={state.code} sessionCode={session?.code} token={session?.token} state={state} update={update} onLeft={onLeft} session={session} onPack={onPack} />;

  const usingDemo = !LIVE && !state.answers && state.stage !== "onboarding" && state.view === "app";
  const where = state.stage === "gate" ? "You" : state.stage === "seats" ? "Your seats" : state.stage === "schedule" ? "Schedule" : state.view === "app" ? `${Math.max(stageIndex, 0) + 1}/${STAGES.length} · ${STAGES[stageIndex]?.[1] || ""}` : state.view === "results" ? "Results" : "Tests";
  return (
    <div className="flex-1 flex flex-col">
      <header className="sticky z-40 text-white" style={{ top: "env(safe-area-inset-top, 0px)", background: "var(--header)" }}>
        <div className="max-w-[560px] mx-auto gutter h-14 flex items-center justify-between gap-3">
          <button onClick={() => { if (inNav) { setReview(""); setTab("table"); scrollTop(); } else go(state.live ? "gate" : "onboarding"); }} className="rt-display font-extrabold text-xl flex items-center gap-2 cursor-pointer text-white"><span aria-hidden="true">🍓</span>{APP_NAME}</button>
          {inNav ? <button type="button" className="where" aria-haspopup="dialog" onClick={() => setSheet(true)}><span>{state.code ? `${state.code}, ` : ""}{looking ? looking.title : here.title}</span><span aria-hidden="true">▾</span></button> : account && state.stage !== "seats" ? <button type="button" onClick={() => go("seats")} className="text-sm font-semibold text-white cursor-pointer min-h-[44px]">Seats</button> : <span className="text-xs sm:text-sm font-semibold text-white/80 truncate">{where}</span>}
        </div>
      </header>
      {usingDemo && <div className="bg-[var(--gold)] text-[var(--on-gold)] text-sm text-center py-1.5 font-semibold gutter">Using demo answers. Do onboarding to use yours.</div>}
      {state.noOverlap && !state.live && state.view === "app" && <div className="bg-[var(--blue)] text-white text-sm text-center py-1.5 font-semibold gutter">No-overlap path: the personas always picked the other vibe</div>}
      {state.gateError && state.stage === "gate" && <div className="bg-[var(--gold)] text-[var(--on-gold)] text-sm text-center py-1.5 font-semibold gutter">{state.gateError}</div>}
      {state.live && state.roomStatus === "cancelled" && state.stage !== "gate" && <div className="bg-[var(--gold)] text-[var(--on-gold)] text-sm text-center py-1.5 font-semibold gutter">This table was cancelled. <button onClick={onLeft} className="underline cursor-pointer">Back to tables</button></div>}
      {inNav && tab === "table" && looking && <div className="nav-review"><div className="max-w-[560px] mx-auto gutter inner"><p className="text-sm font-semibold">Looking back at {looking.title}</p><button type="button" onClick={() => { setReview(""); scrollTop(); }} className="min-h-[36px] px-3 rounded-full bg-[var(--gold)] text-[var(--on-gold)] font-bold cursor-pointer">Back to where you are</button></div></div>}
      <main key={`${state.stage}-${tab}-${review}-${state.view}-${state.run}`} className="flex-1 flex flex-col">{screen}</main>
      {inNav && (
        <nav className="nav-tabs" aria-label="Main">
          <div className="row3">
            {[["table", "🪑", "Table"], ["schedule", "🗓️", "Schedule"], ["you", "🙂", "You"]].map(([id, emoji, label]) => (
              <button key={id} type="button" className="nav-tab" aria-current={tab === id ? "page" : undefined} onClick={() => { setTab(id); if (id !== "table") setReview(""); scrollTop(); }}>
                <span className="e" aria-hidden="true">{emoji}</span>{label}
                {id === "schedule" && badge && <span className="nav-badge">{badge}</span>}
              </button>
            ))}
          </div>
        </nav>
      )}
      {inNav && sheet && (
        <>
          <button type="button" className="nav-scrim" aria-label="Close" onClick={() => setSheet(false)} />
          <div className="nav-sheet" role="dialog" aria-modal="true" aria-label={`Your table, ${state.code || ""}`}>
            <div className="max-w-[560px] mx-auto gutter pt-3 flex flex-col gap-2">
              <div className="w-11 h-1.5 rounded-full bg-[var(--line)] mx-auto" />
              <div className="flex items-center justify-between"><h2 className="rt-display text-xl font-extrabold">Your table{state.code ? `, ${state.code}` : ""}</h2><button type="button" onClick={() => setSheet(false)} className="min-h-[44px] min-w-[44px] text-xl cursor-pointer" aria-label="Close">✕</button></div>
              {JOURNEY.map((s, i) => {
                const st = stepState(s.key, state.stage);
                const showGroup = i === 0 || JOURNEY[i - 1].group !== s.group;
                return (
                  <div key={s.key}>
                    {showGroup && <p className="text-xs font-bold text-[var(--muted)] mt-2">{s.group}</p>}
                    <button type="button" className={`nav-step ${st} ${shakeKey === s.key ? "shake" : ""}`} onAnimationEnd={() => setShakeKey("")} onClick={() => pickStep(s.key)}>
                      <span className="ic">{st === "done" ? "✓" : s.emoji}</span>
                      <span className="min-w-0"><b className="block">{s.title}</b><span className="block text-sm text-[var(--muted)]">{st === "done" ? (review === s.key ? "Looking at this now" : "Done") : st === "now" ? "You're here" : lockReason(s.key, state)}</span></span>
                      <span className={`ml-auto text-sm font-bold ${st === "done" ? "text-[var(--blue)]" : st === "now" ? "text-[var(--coral)]" : ""}`}>{st === "done" ? "Look back" : st === "now" ? "Go" : "🔒"}</span>
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </>
      )}
      {!LIVE && <DemoNav state={state} go={go} setView={setView} reset={() => { store.remove(STATE_KEY); setState({ ...INITIAL, run: state.run + 1 }); scrollTop(); }} toggleFallback={() => update((s) => ({ noOverlap: !s.noOverlap }))} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("rt-root")).render(<App />);
</script>

<script>
(function boot() {
  if (!window.React || !window.ReactDOM || !window.Babel) return setTimeout(boot, 50);
  try {
    var src = document.getElementById("rt-src").textContent;
    var code = Babel.transform(src, { presets: ["react"] }).code;
    new Function(code)();
  } catch (e) {
    var root = document.getElementById("rt-root");
    root.innerHTML = "";
    var pre = document.createElement("pre");
    pre.className = "gutter";
    pre.style.cssText = "color:var(--danger);white-space:pre-wrap;font-size:13px;padding-block:24px";
    pre.textContent = "Strawberry failed to start: " + (e && e.message || e);
    root.appendChild(pre);
  }
})();
</script>
</body>
</html>
