const ALLOW_GMAIL = true;
function emailOk(value) {
  const email = String(value || "").trim();
  if (/^[^\s@]+@berkeley\.edu$/i.test(email)) return true;
  return ALLOW_GMAIL && /^[^\s@]+@gmail\.com$/i.test(email);
}

const activityOf = (title, place) => {
  const known = HOOKS[title];
  if (known) return { ...known, place: place || known.place };
  return { emoji: "🍓", title: title || "The activity", place: place || "Somewhere you can sit and talk" };
};
async function api(action, data) {
  const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action, ...(data || {}) }) });
  const text = await r.text();
  let json;
  try { json = JSON.parse(text); } catch { throw new Error("The server did not answer. Deploy the script as a web app, access: Anyone."); }
  if (!json.ok) throw new Error(json.error || "Request failed.");
  return json;
}

}

const ROUNDS = {
  meetup1: { when: "Thursday · 5:30 pm", place: "A café with a big shared table", area: "5 min walk from Sproul Plaza", why: "Big table, no menus to hide behind.", wear: "Casual. You'll be sitting and talking, not dressing up." },

// =====================================================================
// ENGINE — compares the tester to the personas, then SELECTS content.
// Nothing is generated: every output is a pre-written block above.
// =====================================================================

const optionOf = (card, key) => card.options.find((o) => o.key === key);

function computeOverlaps(answers, personas) {
  const people = [{ name: "You", answers }, ...personas];
  const byCard = CARDS.map((card) => {
    const exact = card.options.map((option) => ({ option, names: people.filter((p) => p.answers[card.id] === option.key).map((p) => p.name) }));
    const fams = ["a", "b"].map((f) => ({ fam: f, info: card.fams[f], names: people.filter((p) => optionOf(card, p.answers[card.id])?.fam === f).map((p) => p.name) }));
    return { card, exact, fams, yourOption: optionOf(card, answers[card.id]), yours: exact.find((g) => g.names.includes("You")), yourFam: fams.find((g) => g.names.includes("You")) };
  });
  const byPersona = personas.map((p) => ({
    name: p.name,
    same: CARDS.filter((c) => p.answers[c.id] === answers[c.id]).map((c) => c.id),
    vibe: CARDS.filter((c) => optionOf(c, p.answers[c.id])?.fam === optionOf(c, answers[c.id])?.fam).map((c) => c.id),
  }));
  return { byCard, byPersona };
}

function whoTogether(names, both, all) {
  const others = names.filter((n) => n !== "You");
  if (names.length === 4) return `All 4 of you ${all}`;
  if (others.length === 2) return `You, ${others[0]} & ${others[1]} ${all}`;
  if (others.length > 2) return `${names.length} of you ${all}`;
  if (others.length === 1) return `You and ${others[0]} ${both}`;
  return "";
}

// Picks the biggest group that includes You (ties: first card).
const biggest = (groups) => groups.reduce((best, g) => (g && g.names.length >= 2 && (!best || g.names.length > best.names.length) ? g : best), null);

// Secret missions: a ring, so everyone has exactly one mission and is exactly one target.
//   You -> the persona you share the FEWEST picks with (bridge the gap), topic = your "from home" pick
//   -> next persona (favorite artist) -> last persona (favorite movie) -> You (hidden talent)
// The app never knows the right answer: at the reveal, the target says right or wrong.
// For the demo, personas' typed answers are simulated (the 2nd one is wrong on purpose).
function assignMissions(answers, home, personas, byPersona, opts) {
  if (!personas.length) return [];
  opts = opts || {};
  const t1 = byPersona.reduce((bi, p, i) => (p.same.length < byPersona[bi].same.length ? i : bi), 0);
  const ring = [{ name: "You", isYou: true }, personas[t1], ...personas.filter((_, i) => i !== t1)];
  const yourTopic = HOME_TO_TOPIC[home] || "talent";
  const topics = personas.length === 3
    ? [yourTopic, "music", "movie", yourTopic === "talent" ? "dish" : "talent"]
    : ring.map((_, i) => (i === 0 ? yourTopic : "talent"));
  return ring.map((guesser, i) => {
    const target = ring[(i + 1) % ring.length];
    const topic = topics[i];
    const fact = target.isYou || !target.facts ? null : target.facts[topic];
    const shared = target.isYou ? 0 : byPersona.find((b) => b.name === target.name).same.length;
    let simulatedGuess = null;
    if (!guesser.isYou) {
      if (target.isYou) simulatedGuess = MISSION_TOPICS[topic].guessAboutYou;
      else if (fact) simulatedGuess = personas.length === 3 && i === 2 ? fact.wrong : fact.answer;
    }
    return {
      guesser: guesser.name, target: target.name, topic,
      topicLabel: MISSION_TOPICS[topic].label, hint: MISSION_TOPICS[topic].hint,
      reason: i === 0
        ? (opts.live ? `${target.name} is at your table. Ask, then ask why it matters.` : `You share only ${shared} pick${shared === 1 ? "" : "s"} with ${target.name}. Time to fix that.`)
        : "",
      truth: fact ? fact.answer : null, // demo only
      simulatedGuess,
    };
  });
}

function buildGame(answers, home, personas, opts) {
  opts = opts || {};
  const { byCard, byPersona } = computeOverlaps(answers, personas);
  const noOverlap = byPersona.every((p) => p.vibe.length === 0);

  // Rule 1: common ground + group name. Same pick first, then same vibe, then fallback.
  const bestPick = biggest(byCard.map((d) => d.yours));
  const bestVibe = biggest(byCard.map((d) => d.yourFam));
  let commonGround, groupName;
  if (bestPick) {
    commonGround = `${whoTogether(bestPick.names, "both picked", "all picked")} ${bestPick.option.label} ${bestPick.option.emoji}. ${ROUNDS.commonSuffix}`;
    groupName = bestPick.option.group;
  } else if (bestVibe) {
    commonGround = `${whoTogether(bestVibe.names, "are both", "are all")} on team ${bestVibe.info.label}. Close enough.`;
    groupName = bestVibe.info.group;
  } else {
    commonGround = ROUNDS.fallbacks.commonGround;
    groupName = ROUNDS.fallbacks.groupName;
  }

  // Rule 2: meeting 1 secret missions (see assignMissions).
  const missions = assignMissions(answers, home, personas, byPersona, opts);

  // Rule 3: next activities = most-shared picks, then shared vibes, then fallback ideas.
  const activities = [];
  const add = (a) => { if (activities.length < 2 && !activities.some((x) => x.title === a.title)) activities.push(a); };
  byCard.map((d) => d.yours).filter((g) => g && g.names.length >= 2).sort((x, y) => y.names.length - x.names.length)
    .forEach((g) => add({ ...g.option.activity, key: g.option.key, because: `You share ${g.option.label}`, fromFallback: false }));
  byCard.filter((d) => d.yourFam && d.yourFam.names.length >= 2).sort((x, y) => y.yourFam.names.length - x.yourFam.names.length)
    .forEach((d) => add({ ...d.yourOption.activity, key: d.yourOption.key, because: `Close to how you like to spend time (${d.yourFam.info.label})`, fromFallback: false }));
  ROUNDS.fallbacks.activities.forEach((a) => add({ ...a, key: null, fromFallback: true }));

  // A few shared interests, never a score. Exact picks first, then a shared style.
  const exactShares = byCard.filter((d) => d.yours && d.yours.names.length >= 2)
    .sort((a, b) => b.yours.names.length - a.yours.names.length).slice(0, 3)
    .map((d) => ({ emoji: d.yours.option.emoji, label: d.yours.option.label }));
  const vibeShares = exactShares.length ? [] : byCard.filter((d) => d.yourFam && d.yourFam.names.length >= 2)
    .sort((a, b) => b.yourFam.names.length - a.yourFam.names.length).slice(0, 2)
    .map((d) => ({ emoji: d.yourOption.emoji, label: d.yourFam.info.label }));
  const shares = exactShares.length ? exactShares : vibeShares;
  const mix = personas.map((p) => `${p.name} (${String(p.from || "").split(",")[0].trim()})`).join(", ");
  const because = !personas.length
    ? "You're the first one here. Share the code so the rest of the table can join."
    : shares.length
    ? `You were grouped because you share ${shares.map((s) => s.label).join(", ")}. Not a whole profile. Around the table: ${mix}.`
    : opts.live
    ? `You were grouped because you showed up for the same activity. Around the table: ${mix}.`
    : `You were grouped because a mixed table of four beats waiting for a perfect match. Around the table: ${mix}.`;

  return { byCard, byPersona, noOverlap, commonGround, groupName, missions, activities, shares, because };
}

// What the demo assumes happened if you skip meeting 1 with the demo menu.
const defaultResults = (missions) => missions.map((m) => {
  const guess = m.guesser === "You" ? m.truth : m.simulatedGuess;
  const correct = m.truth ? guess === m.truth : true;
  return { ...m, guess, correct };
});

// Fallback demo: personas who always picked the OTHER vibe than the tester.
const mirrorPersonas = (answers) =>
  PERSONAS.map((p) => ({ ...p, answers: Object.fromEntries(CARDS.map((c) => {
    const yourFam = optionOf(c, answers[c.id])?.fam || "a";
    return [c.id, c.options.find((o) => o.fam !== yourFam).key];
  })) }));

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

// =====================================================================
// TESTS — 3 scenarios + a coverage check, shown in the "Tests" view.
// =====================================================================
function runTests() {
  const strong = buildGame(PERSONAS[0].answers, "dish", PERSONAS);
  const partial = buildGame(DEFAULT_ANSWERS, "tradition", PERSONAS);
  const none = buildGame(DEFAULT_ANSWERS, "other", mirrorPersonas(DEFAULT_ANSWERS));
  let everyComboOverlaps = true;
  for (let n = 0; n < 4 ** CARDS.length; n++) {
    const ans = Object.fromEntries(CARDS.map((c, i) => [c.id, c.options[(n >> (2 * i)) & 3].key]));
    if (!PERSONAS.some((p) => CARDS.some((c) => optionOf(c, p.answers[c.id]).fam === optionOf(c, ans[c.id]).fam))) { everyComboOverlaps = false; break; }
  }
  const ringOk = (g) => ["You", "Mei", "Diego", "Jordan"].every((n) => g.missions.filter((m) => m.guesser === n).length === 1 && g.missions.filter((m) => m.target === n).length === 1);
  const aboutYou = (g) => g.missions.find((m) => m.target === "You");
  return [
    { name: "Strong overlap: tester answers exactly like Mei", checks: [
      ["Mei shares 8/8 picks", strong.byPersona[0].same.length === 8],
      ["Group name comes from a shared pick", strong.groupName !== ROUNDS.fallbacks.groupName],
      ["Common-ground line names Mei", strong.commonGround.includes("Mei")],
      ["Your mission targets someone other than Mei (you already match her)", strong.missions[0].target !== "Mei"],
      ["Your mission topic is a dish from home", strong.missions[0].topic === "dish"],
    ]},
    { name: "Partial overlap: default demo tester", checks: [
      ["Every persona shares at least one vibe", partial.byPersona.every((p) => p.vibe.length > 0)],
      ["Your mission targets Jordan (0 shared picks)", partial.missions[0].target === "Jordan"],
      ["Everyone has exactly 1 mission and is exactly 1 target", ringOk(partial)],
      ["Your mission topic is a tradition from home", partial.missions[0].topic === "tradition"],
      ["The app does not know the answer about you (you judge it)", aboutYou(partial).truth === null],
      ["One simulated answer is wrong, so the 'wrong' path shows", partial.missions.some((m) => m.truth && m.simulatedGuess && m.simulatedGuess !== m.truth)],
    ]},
    { name: "No overlap: personas always pick the other vibe", checks: [
      ["noOverlap flag is true", none.noOverlap === true],
      ["Fallback group name used", none.groupName === ROUNDS.fallbacks.groupName],
      ["Fallback common-ground line used", none.commonGround === ROUNDS.fallbacks.commonGround],
      ["Both activities are fallbacks", none.activities.every((a) => a.fromFallback)],
      ["Missions still work for everyone", ringOk(none)],
      ["'Something else' gives you a hidden-talent mission", none.missions[0].topic === "talent"],
      ["No topic is used twice when yours is 'talent'", new Set(none.missions.map((m) => m.topic)).size === 4],
    ]},
    { name: `Coverage: all ${(4 ** CARDS.length).toLocaleString("en-US")} possible testers`, checks: [["Every possible tester shares a vibe with at least 1 real persona", everyComboOverlaps]] },
  ];
}

// STORAGE (localStorage, with in-memory fallback if the browser blocks it)
// =====================================================================
const memory = {};
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch { return k in memory ? memory[k] : f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { memory[k] = v; } },
  remove(k) { try { localStorage.removeItem(k); } catch { delete memory[k]; } },
};
const STATE_KEY = "strawberry.state.v1";
const CHECKINS_KEY = "strawberry.checkins";

function sendCheckin(row) {
  const ids = Object.values(FORM_ENTRIES).filter(Boolean);
  if (!CHECKIN_FORM || ids.length < 6) return;
  const body = new URLSearchParams();
  const map = {
    again: row.again ? "Yes" : "No",
    met: row.met ? "Yes" : "No",
    reasons: row.reasons.join(", "),
    connected: row.connected.join(", "),
    connectWhy: row.connectWhy,
    group: row.group,
  };
  Object.entries(FORM_ENTRIES).forEach(([key, id]) => body.append(id, map[key] || ""));
  fetch(CHECKIN_FORM, { method: "POST", mode: "no-cors", body }).catch(() => {});
}

// 4-option card: drag the card toward your pick, or tap it.
// Grid positions: 0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right.
const DIRS = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
function PickCard({ card, onPick }) {
  const [d, setD] = useState({ x: 0, y: 0 });
  const [out, setOut] = useState(null);
  const start = useRef(null), moved = useRef(0);
  const quad = (x, y) => (x < 0 ? 0 : 1) + (y < 0 ? 0 : 2);
  const pick = (i) => { if (out !== null) return; setOut(i); setTimeout(() => onPick(card.options[i].key), 240); };
  const down = (e) => { start.current = { x: e.clientX, y: e.clientY }; moved.current = 0; e.currentTarget.setPointerCapture(e.pointerId); };
  const move = (e) => {
    if (!start.current) return;
    const x = e.clientX - start.current.x, y = e.clientY - start.current.y;
    moved.current = Math.max(moved.current, Math.hypot(x, y)); setD({ x, y });
  };
  const up = (e) => {
    if (!start.current) return;
    const x = e.clientX - start.current.x, y = e.clientY - start.current.y; start.current = null;
    if (Math.hypot(x, y) > 80) return pick(quad(x, y));
    if (moved.current < 8) {
      const el = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-opt]");
      if (el) return pick(+el.dataset.opt);
    }
    setD({ x: 0, y: 0 });
  };
  const cancel = () => { start.current = null; setD({ x: 0, y: 0 }); };
  const active = Math.hypot(d.x, d.y) > 25 ? quad(d.x, d.y) : null;
  const transform = out !== null ? `translate(${DIRS[out][0] * 600}px, ${DIRS[out][1] * 300}px) rotate(${DIRS[out][0] * 20}deg)` : `translate(${d.x}px, ${d.y}px) rotate(${d.x / 25}deg)`;
  return (
    <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={cancel}
      className="select-none rounded-3xl bg-[var(--surface)] border border-[var(--line)] p-4 sm:p-5 shadow-[0_8px_0_var(--line)] cursor-grab"
      style={{ transform, transition: start.current ? "none" : "transform .25s ease", touchAction: "none" }}>
      <p className="text-center text-xs font-bold text-[var(--muted)] uppercase tracking-widest mb-1">Pick one</p>
      <p className="rt-display text-center text-2xl sm:text-3xl font-extrabold mb-4">{card.q}</p>
      <div className="grid grid-cols-2 gap-3">
        {card.options.map((o, i) => (
          <button key={o.key} data-opt={i} onClick={(e) => { if (e.detail === 0) pick(i); }}
            className={`min-w-0 flex flex-col items-center justify-center gap-1.5 rounded-2xl py-6 sm:py-8 border-2 transition ${active === i || out === i ? "bg-[var(--coral)] text-white border-[var(--coral)] scale-105" : "bg-[var(--pink-soft)] border-transparent"}`}>
            <span className="text-5xl sm:text-6xl">{o.emoji}</span>
            <span className="rt-display font-bold text-base sm:text-lg text-center leading-tight px-2">{o.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function CrewChat({ game, personas, next, live, plan, intro, onIntro }) {

// Answer time: the phone goes around, everyone types their answer privately.
function MissionAnswers({ game, personas, onDone, solo }) {
  const missions = solo ? game.missions.filter((m) => m.guesser === "You") : game.missions;
  const [i, setI] = useState(0);
  const [text, setText] = useState("");
  const [error, setError] = useState("");
  const [typed, setTyped] = useState({});
  const m = missions[i];
  const person = m.guesser === "You" ? YOU : personas.find((p) => p.name === m.guesser);
  const advance = (answer) => {
    const all = { ...typed, [m.guesser]: answer };
    setTyped(all); setText(""); setError("");
    if (i < missions.length - 1) setI(i + 1); else onDone(all);
  };
  const submit = (e) => {
    e.preventDefault();
    if (!text.trim()) return setError("Type what you found out first. A guess is fine.");
    advance(text.trim());
  };
  return (
    <TableShell title="Answer time ✍️">
      <p className="text-white/70 text-sm font-semibold">Pass the phone · {i + 1}/{missions.length}</p>
      <div key={i} className="rounded-3xl bg-[var(--surface)] text-[var(--ink)] p-5 flex flex-col gap-4 rt-pop">
        <div className="flex items-center gap-3"><Avatar p={person} size={52} /><p className="rt-display text-2xl font-extrabold">{m.guesser === "You" ? "Your turn" : `${m.guesser}'s turn`}</p></div>
        {m.guesser === "You" ? (
          <form onSubmit={submit} className="flex flex-col gap-3">
            <label htmlFor="mission-answer" className="text-lg">What's <b>{m.target}'s {m.topicLabel}</b>?</label>
            <textarea id="mission-answer" rows={2} maxLength={80} value={text} onChange={(e) => { setText(e.target.value); setError(""); }}
              placeholder="Type it fast, nobody's looking"
              className="w-full rounded-2xl border-2 border-[var(--line)] bg-[var(--bg)] p-3 text-lg text-[var(--ink)] resize-none" />
            {error && <p className="text-sm text-[var(--danger)]">{error}</p>}
            <Btn type="submit">Lock my answer 🔒</Btn>
          </form>
        ) : (
          <>
            <p className="text-lg">{m.guesser} takes the phone and types their answer. Everyone else looks away. 🙈</p>
            <p className="text-sm text-[var(--muted)]">Demo: {m.guesser}'s answer is simulated.</p>
            <Btn onClick={() => advance(m.simulatedGuess)}>{m.guesser} locked their answer 🔒</Btn>
          </>
        )}
      </div>
    </TableShell>
  );
}

// Reveal: phone in the middle. Each answer is shown, and the person it's about says right or wrong.
// A wrong answer never blocks meeting 2.
function MissionReveal({ game, personas, typed, onDone, solo }) {
  const missions = solo ? game.missions.filter((m) => m.guesser === "You") : game.missions;
  const [i, setI] = useState(0);
  const [verdict, setVerdict] = useState(null);
  const [asked, setAsked] = useState(null);
  const [results, setResults] = useState([]);
  const person = (n) => (n === "You" ? YOU : personas.find((p) => p.name === n));
  const total = missions.length;

  if (i >= total) {
    const cracked = results.filter((r) => r.correct).length;
    const all = cracked === total;
    return (
      <TableShell title={all ? "Perfect sync 🔥" : `${cracked}/${total} missions cracked`}>
        <p className="text-white/85 text-lg">{all ? "Every mission cracked. You were clearly paying attention." : "Wrong answers just meant better stories. Nobody gets left behind."}</p>
        <div className="rounded-3xl bg-[var(--gold)] text-[var(--on-gold)] p-5 rt-pop"><p className="rt-display text-2xl font-extrabold">The score was never the point</p><p className="mt-1">What you asked, and what you didn't say, is what meeting 2 opens.</p></div>
        <CrewList results={results} personas={personas} dark />
        <Btn onClick={() => onDone(results)}>Wrap up meeting 1 →</Btn>
      </TableShell>
    );
  }

  const m = missions[i];
  const g = person(m.guesser), t = person(m.target);
  const guess = typed[m.guesser];
  const next = () => {
    setResults([...results, { ...m, guess, correct: verdict === "right" }]);
    setVerdict(null); setAsked(null); setI(i + 1);
  };
  return (
    <TableShell title="Mission reveal 🕵️">
      <p className="text-white/70 text-sm font-semibold">Phone in the middle · {i + 1}/{total}</p>
      <div key={i} className="rounded-3xl bg-[var(--surface)] text-[var(--ink)] p-5 flex flex-col gap-3 rt-pop">
        <div className="flex items-center gap-2"><Avatar p={g} size={40} /><span className="text-2xl">→</span><Avatar p={t} size={40} /></div>
        <p className="text-[var(--muted)]">{m.guesser === "You" ? "Your" : `${m.guesser}'s`} mission: find out {possessive(m.target)} {m.topicLabel}.</p>
        <p className="text-sm font-semibold">{m.guesser === "You" ? "You wrote" : `${m.guesser} wrote`}:</p>
        <p className="rt-display text-3xl font-extrabold leading-tight">“{guess}”</p>
        {!verdict && (
          <>
            <p className="text-lg mt-1">{m.target === "You" ? "Is that right? You decide." : `${m.target}, is that right?`}</p>
            {m.target !== "You" && <p className="text-xs text-[var(--muted)] -mt-2">Demo: tap for {m.target}.</p>}
            <div className="grid grid-cols-2 gap-3">
              <button onClick={() => setVerdict("right")} className="min-h-[56px] rounded-2xl bg-[var(--ok-bg)] text-[var(--ok)] font-bold text-lg cursor-pointer border-2 border-transparent hover:border-[var(--ok)]">✅ Right</button>
              <button onClick={() => setVerdict("wrong")} className="min-h-[56px] rounded-2xl bg-[var(--coral)]/15 text-[var(--coral)] font-bold text-lg cursor-pointer border-2 border-transparent hover:border-[var(--coral)]">❌ Wrong</button>
            </div>
          </>
        )}
        {verdict && (
          <div className="flex flex-col gap-2 rt-pop">
            <p className={`rt-display text-3xl font-extrabold ${verdict === "right" ? "text-[var(--ok)]" : "text-[var(--coral)]"}`}>{verdict === "right" ? "🎯 Nailed it!" : "❌ Not quite!"}</p>
            {verdict === "wrong" && m.truth && <p className="text-lg">{m.target}: “It's actually <b>{m.truth}</b>!”</p>}
            {!asked ? (
              <>
                <p className="text-lg">Ask one question about where {m.target === "You" ? "you're" : `${m.target} is`} from. They decide if it's fair.</p>
                <p className="text-sm text-[var(--muted)]">No politics, no religion, no stereotypes. A kinder question still counts.</p>
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setAsked("fair")} className="min-h-[56px] rounded-2xl bg-[var(--ok-bg)] text-[var(--ok)] font-bold cursor-pointer">Fair question</button>
                  <button onClick={() => setAsked("kinder")} className="min-h-[56px] rounded-2xl bg-[var(--gold)]/30 font-bold cursor-pointer">Try a kinder one</button>
                </div>
              </>
            ) : (
              <p className="rounded-2xl bg-[var(--bg)] p-3">{asked === "fair"
                ? "They took it. Now ask why it matters. That sentence is what you meet again about."
                : "Good. Ask the kinder one, then why it matters. The score is not the point."}</p>
            )}
          </div>
        )}
      </div>
      {verdict && asked && <Btn onClick={next}>{i < total - 1 ? "Next answer" : "See the results"}</Btn>}
    </TableShell>
  );
}

function CrewList({ results, personas, dark }) {
  const person = (n) => (n === "You" ? YOU : personas.find((p) => p.name === n));
  const value = (r) => {
    if (r.correct) return <>{r.guess} ✅</>;
    if (r.truth) return <>{r.truth} <span className="opacity-70">(not “{r.guess}”)</span></>;
    return <>you set them straight <span className="opacity-70">(not “{r.guess}”)</span></>;
  };
  return (
    <div className="flex flex-col gap-2">
      {results.map((r, k) => (
        <div key={k} className={`rounded-2xl p-3 flex items-center gap-3 ${dark ? "bg-white/10" : "bg-[var(--bg)]"}`}>
          <Avatar p={person(r.target)} size={34} />
          <p className="min-w-0 text-sm"><b>{r.target === "You" ? "Your" : `${r.target}'s`} {r.topicLabel}:</b> {value(r)}</p>
        </div>
      ))}
    </div>
  );
}

function TableIcebreaker({ game, personas, state, session, onDone }) {
  const [prompts, setPrompts] = useState([]);
  const [note, setNote] = useState("");
  const [busy, setBusy] = useState(true);
  const backup = (MINI_GAMES.find((g) => g.id === "truths") || {}).deck || [];
  const context = [state.activity, ...personas.map((p) => String(p.from || "").split(",")[0].trim()).filter(Boolean), ...(game.shares || []).map((s) => s.label)].filter(Boolean).join(" · ");
  const load = (refresh) => {
    setBusy(true);
    api("icebreaker", {
      code: session && session.code, token: session && session.token, refresh: !!refresh,
      shares: (game.shares || []).map((s) => s.label),
    }).then((data) => {
      setPrompts(data.prompts || []);
      setNote((data.prompts || []).length ? "" : (data.error || "Using the backup prompts for this table."));
    }).catch((e) => {
      setPrompts([]);
      setNote(e.message || "Using the backup prompts for this table.");
    }).finally(() => setBusy(false));
  };
  useEffect(() => { load(false); }, []);
  const deck = prompts.length ? prompts : backup.slice(0, 3);
  return (
    <TableShell chip="📱 Meeting 1" title="Icebreaker for this table">
      <p className="text-white/75 text-sm">{context}</p>
      {busy ? <p className="text-lg">Writing one for this activity and the people here…</p> : (
        <div className="flex flex-col gap-3">
          {deck.map((line) => <div key={line} className="rounded-3xl bg-[var(--gold)] text-[var(--on-gold)] p-5 rt-pop"><p className="rt-display text-xl font-extrabold leading-snug">{line}</p></div>)}
        </div>
      )}
      {note && <p className="text-sm text-[var(--gold)]">{note}</p>}
      <Btn ghost dark onClick={() => load(true)}>{busy ? "Writing…" : "Write another"}</Btn>
      <Btn onClick={onDone}>Now the secret mission</Btn>
    </TableShell>
  );
}

function Meeting1({ game, personas, update, next, live, state, session }) {
  const [step, setStep] = useState("intro");
  const [typed, setTyped] = useState({});
  if (!game.missions.length) return (
    <TableShell center>
      <Title dark big>Wait for your table.</Title>
      <p className="text-white/80 text-lg">Someone still has to join with your code before the mission can start.</p>
    </TableShell>
  );
  if (step === "intro") return (
    <TableShell center>
      <div className="flex flex-col gap-5 text-center items-center rt-pop">
        <div className="text-7xl">☕🕵️</div>
        <Title dark big>Welcome to meeting 1.</Title>
        <p className="text-white/80 text-lg max-w-[40ch]">{live ? "The opening lines are written for this activity and the people at the table. Then one secret mission: get a true answer, and ask why it matters." : "Start with two truths and a lie. Then one secret mission: get a true answer, and ask why it matters. That is the connection."}</p>
        <Btn onClick={() => setStep(live ? "ice" : "opening")}>{live ? "Make our icebreaker" : "Start the opening game"}</Btn>
      </div>
    </TableShell>
  );
  if (step === "ice") return <TableIcebreaker game={game} personas={personas} state={state} session={session} onDone={() => setStep("brief")} />;
  if (step === "opening") {
    const opener = MINI_GAMES.find((g) => g.id === "truths");
    return (
      <TableShell chip="📱 Meeting 1" title="Two truths and a lie">
        <p className="text-white/85 text-lg">{opener.how}</p>
        <OpeningDeck deck={opener.deck} />
        <Btn onClick={() => setStep("brief")}>Now the secret mission</Btn>
      </TableShell>
    );
  }
  if (step === "brief") return <MissionBriefing game={game} personas={personas} onReady={() => setStep("live")} />;
  if (step === "live") return <MissionInProgress game={game} personas={personas} onEnd={() => setStep("answers")} />;
  if (step === "answers") return <MissionAnswers game={game} personas={personas} solo={live} onDone={(t) => { setTyped(t); setStep("reveal"); }} />;
  if (step === "reveal") return <MissionReveal game={game} personas={personas} typed={typed} solo={live} onDone={(r) => { update({ m1: { missionResults: r } }); setStep("seal"); }} />;
  if (step === "seal") return <SealLine personas={personas} live={live} onDone={(line, bye) => { update({ capsule: line, bye: bye || "See you next time" }); setStep("end"); }} />;
  return (
    <TableShell center>
      <div className="flex flex-col gap-5 text-center items-center rt-pop">
        <div className="text-7xl">🎬</div>
        <Title dark big>That's a wrap on meeting 1.</Title>
        <p className="text-white/80 text-lg max-w-[40ch]">The lines stay sealed. Meeting 2 is where they open.</p>
        <p className="rt-display text-2xl font-extrabold">{(live ? personas.map((p) => p.bye || "See you next time") : personas.map((p) => LEFTOVER[p.name].bye)).join(" · ")}</p>
        <Btn onClick={next}>Later that evening… →</Btn>
      </div>
    </TableShell>
  );
}

function SealLine({ personas, onDone, live }) {
  const [text, setText] = useState("");
  const [bye, setBye] = useState("");
  const [error, setError] = useState("");
  const seal = (e) => {
    e.preventDefault();
    if (text.trim().length < 2) return setError("One sentence you didn't get to say.");
    onDone(text.trim(), bye.trim());
  };
  return (
    <TableShell title="Leave one line sealed">
      <p className="text-white/85 text-lg">You each said one thing out loud. Write the line you didn't say. Nobody reads it until you're together again.</p>
      {live
        ? personas.map((p) => <p key={p.name} className="rounded-2xl bg-white/10 px-4 py-3">✉️ {p.name} {p.hasCapsule ? "sealed a line." : "hasn't sealed one yet."}</p>)
        : personas.map((p) => <p key={p.name} className="rounded-2xl bg-white/10 px-4 py-3">✉️ {p.name} sealed a line. <span className="text-white/70">{LEFTOVER[p.name].bye}</span></p>)}
      <form onSubmit={seal} className="flex flex-col gap-3">
        <label htmlFor="capsule" className="font-semibold">Your sealed line</label>
        <textarea id="capsule" rows={2} maxLength={120} value={text} onChange={(e) => { setText(e.target.value); setError(""); }} placeholder="Next time, ask me about…" className="w-full rounded-2xl border-2 border-white/20 bg-white/10 p-3 text-lg text-white resize-none" />
        {live && (
          <>
            <label htmlFor="bye" className="font-semibold">How you say see you next time</label>
            <input id="bye" maxLength={40} value={bye} onChange={(e) => setBye(e.target.value)} placeholder="See you next time" className="w-full rounded-2xl border-2 border-white/20 bg-white/10 p-3 text-lg text-white" />
          </>
        )}
        {error && <p className="text-sm text-[var(--gold)]">{error}</p>}
        <Btn type="submit">Seal it until we meet again</Btn>
      </form>
    </TableShell>
  );
}

function AfterMeeting1({ game, personas, state, update, next, live }) {
  const [copied, setCopied] = useState("");
  const [error, setError] = useState("");
  if (live) {
    const activity = activityOf(state.activity, state.place);
    return (
      <Screen>
        <Chip>After meeting 1</Chip>
        <Title>Same activity, next time</Title>
        <p className="text-[var(--muted)]">Meeting 2 continues this table. It does not start a new activity.</p>
        <div className="rounded-3xl bg-[var(--coral)] text-white p-5">
          <p className="text-xs font-bold uppercase tracking-widest text-white/80">The hook</p>
          <p className="rt-display text-3xl font-extrabold mt-1">{activity.emoji} {activity.title}</p>
          <p className="mt-1 text-white/90">{activity.place}</p>

        <section className="flex flex-col gap-3">
          <h2 className="rt-display text-xl font-bold">Lock a time</h2>

        </section>
        <Btn onClick={() => (state.slot ? next() : setError("Lock a time first."))}>See you then →</Btn>
        {error && <p className="text-sm text-[var(--danger)] -mt-3">{error}</p>}
      </Screen>
    );
  }
  const results = state.m1?.missionResults || defaultResults(game.missions);
  const wrong = results.find((r) => !r.correct);
  const memoryLine = wrong
    ? `The night ${wrong.guesser === "You" ? "you were" : `${wrong.guesser} was`} sure ${possessive(wrong.target)} ${wrong.topicLabel} was “${wrong.guess}”.${wrong.truth ? ` (It's ${wrong.truth}.)` : ""}`
    : "The night all 4 secret missions got cracked. Spies, every one of you.";
  // Simulated persona votes: they vote for the activity they picked; otherwise alternate.
  const personaVotes = personas.map((p, k) => {
    const picks = game.activities.map((a) => a.key && Object.values(p.answers).includes(a.key));
    return picks[0] !== picks[1] ? (picks[0] ? 0 : 1) : k % 2;
  });
  const tally = [0, 1].map((k) => personaVotes.filter((v) => v === k).length + (state.vote === k ? 1 : 0));
  const chosen = live ? state.vote : (state.vote === null ? null : tally[0] === tally[1] ? state.vote : tally[0] > tally[1] ? 0 : 1);
  const act = chosen === null ? null : game.activities[chosen];
  const message = act && state.slot
    ? `Hey ${game.groupName} 👋\nMeetup #2 picks up Thursday's conversation: ${act.title} ${act.emoji}\n📍 ${act.place}\n🗓️ ${state.slot}\nWho's in? Reply 🙋`
    : "";
  const msgRef = useRef(null);
  const copy = () => {
    const selectText = () => { const r = document.createRange(); r.selectNodeContents(msgRef.current); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); };
    const fallback = () => { selectText(); setCopied("Copying is blocked here. The text is selected, copy it manually."); };
    try {
      navigator.clipboard.writeText(message).then(() => setCopied("Copied! Paste it in your group chat."), fallback);
    } catch { fallback(); }
  };
  return (
    <Screen>
      <Chip>After meeting 1</Chip>
      <Title>Here's how it went 📸</Title>
      <div className="rounded-2xl bg-[var(--blue)] text-white p-4"><p className="text-xs font-bold uppercase tracking-widest text-[var(--gold)]">Your group's signature</p><p className="rt-display text-3xl font-extrabold mt-1">{game.groupName}</p></div>
      <div className={`${CARD} p-4 flex flex-col gap-2`}>
        <p className="text-xs font-bold uppercase tracking-widest text-[var(--coral)]">Crew card · what you learned</p>
        <CrewList results={results} personas={personas} />
      </div>
      <div className="rounded-2xl bg-[var(--gold)] text-[var(--on-gold)] p-4 rotate-[-1.5deg] shadow-[0_6px_0_var(--line)]"><p className="text-xs font-bold uppercase tracking-widest">Shared memory card</p><p className="rt-display text-xl font-bold mt-1">“{memoryLine}”</p></div>

      <div className="rounded-3xl border-2 border-dashed border-[var(--coral)] p-5 bg-[var(--coral)]/10 rt-pop">
        <p className="rt-display text-2xl font-extrabold">🔓 Meeting 2 unlocked</p>
        <p className="mt-1 text-[var(--muted)]">Meeting 2 is the same conversation, somewhere else. Not a new icebreaker.</p>
      </div>

      <section className="flex flex-col gap-3">
        <h2 className="rt-display text-xl font-bold">1. Vote: what's next?</h2>
        {game.activities.map((a, k) => (
          <button key={k} onClick={() => { update({ vote: k }); setError(""); }} className={`text-left rounded-2xl p-4 border-2 transition cursor-pointer ${state.vote === k ? "border-[var(--coral)] bg-[var(--coral)]/10" : "border-[var(--line)] bg-[var(--surface)]"}`}>
            <p className="rt-display font-bold text-lg min-w-0">{a.emoji} {a.title}</p>
            <p className="text-sm text-[var(--muted)]">{a.place}</p>
            <p className="text-xs text-[var(--ok)] font-semibold mt-1">Why: {a.because}</p>
          </button>
        ))}
        {state.vote !== null && <p className="text-sm text-[var(--muted)]">Next plan: <b className="text-[var(--ink)]">{act.title}</b>. Everyone is still invited. No scores.</p>}
      </section>

      <section className="flex flex-col gap-3">
        <h2 className="rt-display text-xl font-bold">2. Our Berkeley list</h2>
        <p className="text-sm text-[var(--muted)]">One thing you want to do here with this group. Nobody gets dropped off the list.</p>
        {live
          ? personas.map((p) => <p key={p.name} className="rounded-2xl bg-[var(--bg)] px-4 py-3"><b>{p.name}:</b> {p.wish || "Still writing theirs."}</p>)
          : personas.map((p) => <p key={p.name} className="rounded-2xl bg-[var(--bg)] px-4 py-3"><b>{p.name}:</b> {BERKELEY_LIST[p.name]}</p>)}
        <label htmlFor="wish" className="font-semibold">Yours</label>
        <input id="wish" maxLength={80} value={state.wish || ""} onChange={(e) => { update({ wish: e.target.value }); setError(""); }} placeholder="Something you want to do in Berkeley together" className="w-full rounded-2xl border-2 border-[var(--line)] bg-[var(--surface)] p-3 text-lg text-[var(--ink)]" />
      </section>

      <section className="flex flex-col gap-3">
        <h2 className="rt-display text-xl font-bold">3. Lock a time</h2>
        <div className="flex gap-2 flex-wrap">{ROUNDS.slots.map((s) => <button key={s} onClick={() => { update({ slot: s }); setError(""); }} className={`min-h-[44px] rounded-full px-4 py-2 font-semibold border-2 cursor-pointer ${state.slot === s ? "bg-[var(--blue)] text-[var(--gold)] border-[var(--blue)]" : "bg-[var(--surface)] border-[var(--line)]"}`}>{state.slot === s ? "🔒 " : ""}{s}</button>)}</div>
      </section>

      {message && (
        <section className="flex flex-col gap-2 rt-pop">
          <h2 className="rt-display text-xl font-bold">4. Send it to the group</h2>
          <div ref={msgRef} className="rounded-2xl rounded-tr-sm bg-[var(--chat)] text-[var(--chat-ink)] p-4 whitespace-pre-line text-[15px] border border-[var(--line)] select-text">{message}</div>
          <Btn ghost onClick={copy}>📋 Copy WhatsApp message</Btn>
          {copied && <p className="text-sm text-[var(--ok)] font-semibold">{copied}</p>}
        </section>
      )}
      <Btn onClick={() => (message && (state.wish || "").trim() ? next() : setError(message ? "Add your Berkeley wish first." : "Vote and lock a time first."))}>Fast forward 2 days →</Btn>
      {error && <p className="text-sm text-[var(--danger)] -mt-3">{error}</p>}
    </Screen>
  );
}

function CheckIn({ game, personas, live, code, sessionCode, token }) {
  const [again, setAgain] = useState(null);
  const [met, setMet] = useState(null);
  const [reasons, setReasons] = useState([]);
  const [connected, setConnected] = useState([]);
  const [connectWhy, setConnectWhy] = useState("");
  const [error, setError] = useState("");
  const [saved, setSaved] = useState(false);
  const [busy, setBusy] = useState(false);
  const toggle = (r) => { setReasons(reasons.includes(r) ? reasons.filter((x) => x !== r) : [...reasons, r]); setError(""); };
  const toggleWho = (name) => {
    setError("");
    if (name === "Nobody yet") return setConnected(connected.includes(name) ? [] : ["Nobody yet"]);
    const next = connected.filter((n) => n !== "Nobody yet");
    setConnected(next.includes(name) ? next.filter((n) => n !== name) : [...next, name]);
  };
  const submit = async () => {
    if (again === null || met === null) return setError("Answer both yes/no questions first.");
    if (!reasons.length) return setError("Pick at least one reason.");
    if (!connected.length) return setError("Say who you connected with. Nobody yet is a fine answer.");
    if (!connectWhy.trim()) return setError("Add one line on why, so the next group can be better.");
    const row = { again, met, reasons, connected, connectWhy: connectWhy.trim(), group: game.groupName, at: new Date().toISOString() };
    if (live) {
      setBusy(true);
      try {
        await api("checkin", { code: sessionCode, token, again, met, reasons, connected, connectWhy: row.connectWhy, group: game.groupName });
      } catch (e) {
        setBusy(false);
        return setError(e.message || "Could not save. Try again.");
      }
    } else {
      store.set(CHECKINS_KEY, [...store.get(CHECKINS_KEY, []), row]);
      sendCheckin(row);
    }
    setSaved(true);
  };
  if (saved) return <ChatReady game={game} personas={personas} live={live} code={code} />;
  return (
    <Screen>
      <Chip>Check-in</Chip>
      <Title>Quick check-in 📝</Title>
      <div className="flex flex-col gap-2"><p className="font-semibold text-lg">Would you do this again?</p><YesNo value={again} onChange={(v) => { setAgain(v); setError(""); }} /></div>
      <div className="flex flex-col gap-2"><p className="font-semibold text-lg">Did you meet again?</p><YesNo value={met} onChange={(v) => { setMet(v); setError(""); }} /></div>
      <div className="flex flex-col gap-2">
        <p className="font-semibold text-lg">Who did you connect with?</p>
        <div className="flex flex-wrap gap-2">{[...personas.map((p) => p.name), "Nobody yet"].map((name) => <button key={name} onClick={() => toggleWho(name)} className={`min-h-[44px] rounded-full px-4 py-2 text-sm font-semibold border-2 cursor-pointer ${connected.includes(name) ? "bg-[var(--blue)] text-[var(--gold)] border-[var(--blue)]" : "bg-[var(--surface)] border-[var(--line)]"}`}>{name}</button>)}</div>
      </div>
      <div className="flex flex-col gap-2">
        <label htmlFor="connect-why" className="font-semibold text-lg">Why?</label>
        <textarea id="connect-why" rows={2} maxLength={160} value={connectWhy} onChange={(e) => { setConnectWhy(e.target.value); setError(""); }} placeholder="One sentence. This shapes the next group." className="w-full rounded-2xl border-2 border-[var(--line)] bg-[var(--surface)] p-3 text-lg text-[var(--ink)] resize-none" />
      </div>
      <div className="flex flex-col gap-2">
        <p className="font-semibold text-lg">What played a part? <span className="text-sm font-normal text-[var(--muted)]">pick any</span></p>
        <div className="flex flex-wrap gap-2">{ROUNDS.checkinReasons.map((r) => <button key={r} onClick={() => toggle(r)} className={`min-h-[44px] rounded-full px-4 py-2 text-sm font-semibold border-2 cursor-pointer ${reasons.includes(r) ? "bg-[var(--coral)] text-white border-[var(--coral)]" : "bg-[var(--surface)] border-[var(--line)]"}`}>{r}</button>)}</div>
      </div>
      <Btn onClick={submit}>{busy ? "Saving…" : "OK, submit"}</Btn>
      {error && <p className="text-sm text-[var(--danger)] -mt-3">{error}</p>}
    </Screen>
  );
}

function shareLines(game) {
  const lines = [];
  (game.byCard || []).forEach((d) => {
    if (!d.yours || d.yours.names.length < 2) return;
    const others = d.yours.names.filter((n) => n !== "You");
    if (!others.length) return;
    lines.push(`You and ${others.join(" and ")} both like ${d.yours.option.label}.`);
  });
  return lines.slice(0, 3);
}

function LiveGate({ initialCode, onJoined }) {
  const savedUser = loadUser();
  const [step, setStep] = useState(savedUser ? "profile" : "email");
  const [user, setUser] = useState(savedUser);
  const [pin, setPin] = useState("");
  const [mode, setMode] = useState(initialCode ? "join" : "");
  const [form, setForm] = useState({ name: "", email: savedUser ? savedUser.email : "", from: "", standing: "", activity: "", when: "", place: "", code: initialCode || "" });
  const [cards, setCards] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const set = (k) => (v) => { setForm((f) => ({ ...f, [k]: v })); setError(""); };
  useEffect(() => {
    if (!savedUser) return;
    api("me", { userToken: savedUser.token }).then((data) => {
      const profile = data.profile || {};
      const answers = profile.answers || {};
      setForm((f) => ({
        ...f,
        email: data.email || savedUser.email,
        name: profile.name || f.name,
        from: profile.from || f.from,
        standing: profile.standing || f.standing,
      }));
      if (profile.home && Object.keys(answers).length >= CARDS.length) setCards({ answers, home: profile.home });
    }).catch(() => {
      store.remove(USER_KEY);
      setUser(null);
      setStep("email");
    });
  }, []);
  const sendCode = async () => {
    if (!emailOk(form.email)) return setError(ALLOW_GMAIL ? "Use your @berkeley.edu or a Gmail address." : "Use your @berkeley.edu email.");
    setBusy(true); setError("");
    try {
      await api("sendCode", { email: form.email.trim() });
      setStep("code");
    } catch (e) {
      setError(e.message || "Could not send the code.");
    }
    setBusy(false);
  };
  const verify = async () => {
    if (!/^\d{4}$/.test(pin.trim())) return setError("Enter the 4-digit code from your email.");
    setBusy(true); setError("");
    try {
      const data = await api("verifyCode", { email: form.email.trim(), code: pin.trim() });
      const next = { token: data.token, email: data.email };
      store.set(USER_KEY, next);
      setUser(next);
      const profile = data.profile || {};
      const answers = profile.answers || {};
      setForm((f) => ({
        ...f,
        email: data.email,
        name: profile.name || "",
        from: profile.from || "",
        standing: profile.standing || "",
      }));
      if (profile.home && Object.keys(answers).length >= CARDS.length) setCards({ answers, home: profile.home });
      setStep("profile");
    } catch (e) {
      setError(e.message || "That code did not work.");
    }
    setBusy(false);
  };
  const switchEmail = () => {
    store.remove(USER_KEY);
    setUser(null);
    setPin("");
    setCards(null);
    setForm((f) => ({ ...f, email: "", name: "", from: "", standing: "" }));
    setStep("email");
  };
  const startCards = () => {
    if (form.name.trim().length < 2) return setError("Add your name.");
    if (!emailOk(form.email)) return setError(ALLOW_GMAIL ? "Use your @berkeley.edu or a Gmail address." : "Use your @berkeley.edu email.");
    if (form.from.trim().length < 2) return setError("Add where you're from.");
    if (!form.standing) return setError("Say if you're an undergrad, an exchange student, or a grad student.");
    setError("");
    if (cards) { setStep("table"); return; }
    setStep("cards");
  };
  const submit = async (modeName) => {
    if (!user) return setError("Sign in again, then come back to the table.");
    if (modeName === "host") {
      if (form.activity.trim().length < 2) return setError("Name the activity. That is why you sit together.");
      if (form.when.trim().length < 2) return setError("Add when you meet.");
      if (form.place.trim().length < 2) return setError("Add where you meet.");
    } else if (!/^[A-Z0-9]{4}$/i.test(form.code.trim())) return setError("Enter the 4-character code.");
    setBusy(true); setError("");
    try {
      await onJoined({ ...form, code: form.code.trim().toUpperCase(), answers: cards.answers, home: cards.home, secret: "", mode: modeName, userToken: user.token });
    } catch (e) {
      setBusy(false);
      setError(e.message || "Could not reach the sheet.");
    }
  };
  if (step === "cards") return (
    <div className="flex-1 flex flex-col">
      <Onboarding cardsOnly onDone={(answers, home) => { setCards({ answers, home }); setStep("table"); }} />
    </div>
  );
  if (step === "table" && !mode) return (
    <Screen center>
      <div className="rt-pop flex flex-col gap-5">
        <div className="text-6xl">🍓</div>
        <Title big>Find a table.</Title>
        <p className="text-lg text-[var(--muted)]">Open one activity, or sit down at a table that already exists. Up to six people.</p>
        <Btn onClick={() => { setError(""); setMode("host"); }}>Host a table</Btn>
        <Btn ghost onClick={() => { setError(""); setMode("join"); }}>Join with a code</Btn>
      </div>
    </Screen>
  );
  if (step === "table") return (
    <Screen>
      <button onClick={() => setMode("")} className="self-start font-semibold text-[var(--muted)] cursor-pointer min-h-[44px]">← Back</button>
      <Title>{mode === "host" ? "Host a table" : "Join a table"}</Title>
      {mode === "host" ? (
        <>
          <p className="font-semibold">The activity for this table</p>
          <div className="flex flex-wrap gap-2">
            {ACTIVITY_HOOKS.map((a) => (
              <button key={a} onClick={() => set("activity")(a)} className={`min-h-[44px] rounded-full px-4 py-2 text-sm font-semibold border-2 cursor-pointer ${form.activity === a ? "bg-[var(--coral)] text-white border-[var(--coral)]" : "bg-[var(--surface)] border-[var(--line)]"}`}>{a}</button>
            ))}
          </div>
          <Field id="activity" label="Or name it" value={form.activity} set={set("activity")} placeholder="Boba crawl" />
          <Field id="when" label="When" value={form.when} set={set("when")} placeholder="Thursday · 5:30 pm" maxLength={60} />
          <Field id="place" label="Where" value={form.place} set={set("place")} placeholder="A café near Sproul" maxLength={80} />
          <Btn onClick={() => submit("host")}>{busy ? "Opening…" : "Open the table"}</Btn>
        </>
      ) : (
        <>
          <Field id="code" label="Table code" value={form.code} set={(v) => set("code")(v.toUpperCase())} placeholder="AB3K" maxLength={4} />
          <Btn onClick={() => submit("join")}>{busy ? "Joining…" : "Join the table"}</Btn>
        </>
      )}
      {error && <p className="text-sm text-[var(--danger)]">{error}</p>}
    </Screen>
  );
  if (step === "email" || step === "code") return (
    <Screen>
      {step === "code" ? (
        <>
          <div className="text-5xl">🍓</div>
          <Title big>Check your email.</Title>
          <p className="text-lg text-[var(--muted)]">We sent a 4-digit code to {form.email}. It expires in 10 minutes.</p>
          <Field id="pin" label="Code" value={pin} set={(v) => { setPin(v.replace(/\D/g, "").slice(0, 4)); setError(""); }} placeholder="0000" maxLength={4} />
          {error && <p className="text-sm text-[var(--danger)]">{error}</p>}
          <Btn onClick={verify}>{busy ? "Checking…" : "Sign in"}</Btn>
          <button onClick={() => { setStep("email"); setError(""); }} className="self-start font-semibold text-[var(--muted)] cursor-pointer min-h-[44px]">← Back</button>
        </>
      ) : (
        <>
          <div className="text-5xl">🍓</div>
          <Title big>Sign in.</Title>
          <p className="text-lg text-[var(--muted)]">Use your Berkeley email. We send a code. This phone remembers you after that.</p>
          <Field id="email" label={ALLOW_GMAIL ? "Berkeley email or Gmail" : "Berkeley email"} value={form.email} set={set("email")} placeholder={ALLOW_GMAIL ? "you@berkeley.edu or you@gmail.com" : "you@berkeley.edu"} maxLength={80} />
          {ALLOW_GMAIL && <p className="text-sm text-[var(--muted)]">Gmail is only for testing. One address is still one person.</p>}
          {error && <p className="text-sm text-[var(--danger)]">{error}</p>}
          <Btn onClick={sendCode}>{busy ? "Sending…" : "Email me a code"}</Btn>
        </>
      )}
    </Screen>
  );
  return (
    <Screen>
      <div className="text-5xl">🍓</div>
      <Title big>Your seat.</Title>
      <p className="text-lg text-[var(--muted)]">Name, where you're from, and whether you are here for a term or a degree. Then you find a table.</p>
      <p className="text-sm text-[var(--muted)]">{form.email}</p>
      <Field id="name" label="Your name" value={form.name} set={set("name")} placeholder="Alex" />
      <Field id="from" label="Where you're from" value={form.from} set={set("from")} placeholder="Taipei" />
      <div className="flex flex-col gap-2">
        <p className="font-semibold">You are</p>
        <div className="flex flex-wrap gap-2">
          {STANDINGS.map((s) => (
            <button key={s.key} onClick={() => set("standing")(s.key)} className={`min-h-[44px] rounded-full px-4 py-2 text-sm font-semibold border-2 cursor-pointer ${form.standing === s.key ? "bg-[var(--blue)] text-[var(--gold)] border-[var(--blue)]" : "bg-[var(--surface)] border-[var(--line)]"}`}>{s.label}</button>
          ))}
        </div>
        {form.standing === "grad" && <p className="text-sm text-[var(--muted)]">Stay if you want to meet again.</p>}
      </div>
      {error && <p className="text-sm text-[var(--danger)]">{error}</p>}
      <Btn onClick={startCards}>{cards ? "Find a table" : "Next"}</Btn>
      <button onClick={switchEmail} className="self-start font-semibold text-[var(--muted)] cursor-pointer min-h-[44px]">Use a different email</button>
    </Screen>
  );
}

function initialView() {
  try { const h = location.hash.replace("#", ""); return h === "results" || h === "tests" ? h : "app"; } catch { return "app"; }
}

function App() {
  const [session, setSession] = useState(() => (LIVE ? loadSession() : null));
  const [state, setState] = useState(() => {
    if (!LIVE) return { ...INITIAL, ...store.get(STATE_KEY, {}), view: initialView() };
    const saved = loadSession() ? store.get(STATE_KEY, {}) : {};
    return { ...INITIAL, ...saved, live: true, view: "app", stage: loadSession() ? (saved.stage && saved.stage !== "onboarding" && saved.stage !== "gate" ? saved.stage : "reveal") : "gate" };
  });
  useEffect(() => store.set(STATE_KEY, state), [state]);
  useEffect(() => {
    if (!LIVE) {
      try { history.replaceState(null, "", state.view === "app" ? location.pathname + location.search : `#${state.view}`); } catch {}
    }
  }, [state.view]);
  const sessionRef = useRef(session);
  sessionRef.current = session;
  const update = (patch) => setState((s) => {
    const next = { ...s, ...(typeof patch === "function" ? patch(s) : patch) };
    const sess = sessionRef.current;
    if (LIVE && sess) {
      const fields = {};
      ["capsule", "wish", "vote", "slot", "intro", "bye"].forEach((k) => {
        if (next[k] !== s[k] && next[k] != null && next[k] !== "") fields[k] = next[k];
      });
      if (Object.keys(fields).length) api("save", { code: sess.code, token: sess.token, ...fields }).catch(() => {});
    }
    return next;
  });
  const scrollTop = () => { try { window.scrollTo(0, 0); } catch {} };
  const go = (stage) => { update((s) => ({ stage, view: "app", run: s.run + 1 })); scrollTop(); };
  const setView = (view) => { update({ view }); scrollTop(); };
  useEffect(() => {
    if (!LIVE || !session) return;
    let stop = false;
    const pull = async () => {
      try {
        const data = await api("getState", { code: session.code, token: session.token });
        if (stop) return;
        setState((s) => ({
          ...s,
          live: true,
          code: data.room.code,
          activity: data.room.activity,
          when: data.room.when,
          place: data.room.place,
          people: data.people,
          hook: s.hook || data.room.activity,
          answers: s.answers || data.you.answers,
          home: s.home || data.you.home,
          standing: s.standing || data.you.standing,
          intro: s.intro || data.you.intro || "",
          capsule: s.capsule || data.you.capsule || "",
          wish: s.wish || data.you.wish || "",
          bye: s.bye || data.you.bye || "",
          slot: s.slot || data.you.slot || null,
          vote: s.vote != null ? s.vote : (data.you.vote === "" || data.you.vote == null ? null : Number(data.you.vote)),
          stage: s.stage === "gate" || s.stage === "onboarding" ? "reveal" : s.stage,
        }));
      } catch (e) {
        if (stop) return;
        store.remove(SESSION_KEY);
        setSession(null);
        setState((s) => ({ ...INITIAL, live: true, stage: "gate", run: s.run + 1, gateError: e.message }));
      }
    };
    pull();
    const id = setInterval(pull, 5000);
    return () => { stop = true; clearInterval(id); };
  }, [session]);

  const answers = state.answers || DEFAULT_ANSWERS;
  const home = state.home || "dish";
  const personas = useMemo(() => {
    if (state.live) return peopleToPersonas(state.people);
    return state.noOverlap ? mirrorPersonas(answers) : PERSONAS;
  }, [state.live, state.people, state.noOverlap, answers]);
  const game = useMemo(() => buildGame(answers, home, personas, { live: state.live }), [answers, home, personas, state.live]);
  const stageIndex = STAGES.findIndex(([k]) => k === state.stage);
  const nextStage = () => {
    if (state.live && state.stage === "after1") { go("meeting2"); return; }
    go(STAGES[Math.max(stageIndex, 0) + 1][0]);
  };
  const plan = { when: state.when || ROUNDS.meetup1.when, place: state.place || ROUNDS.meetup1.place };
  const props = { game, personas, home, state, update, next: nextStage, live: !!state.live, plan, intro: state.intro, onIntro: (line) => update({ intro: line }) };

  const join = async (body) => {
    const data = await api(body.mode === "host" ? "createRoom" : "join", body);
    const nextSession = { code: data.room.code, token: data.token, person_id: data.person_id };
    store.set(SESSION_KEY, nextSession);
    setSession(nextSession);
    const url = `${location.pathname}?room=${data.room.code}`;
    try { history.replaceState(null, "", url); } catch {}
    setState((s) => ({
      ...s, live: true, stage: "reveal", view: "app", run: s.run + 1,
      answers: body.answers, home: body.home, standing: body.standing, hook: data.room.activity,
      code: data.room.code, activity: data.room.activity, when: data.room.when, place: data.room.place,
      people: data.people || [], m1: {}, vote: null, slot: null, poked: false, intro: "", capsule: "", wish: "", bye: "",
    }));
    scrollTop();
  };

  let screen;
  if (!LIVE && state.view === "results") screen = <Results back={() => setView("app")} />;
  else if (!LIVE && state.view === "tests") screen = <Tests back={() => setView("app")} />;
  else if (state.live && state.stage === "gate") screen = <LiveGate initialCode={roomFromUrl()} onJoined={join} />;
  else if (state.stage === "onboarding") screen = <Onboarding onDone={(a, h, standing, hook) => { update((s) => ({ answers: a, home: h, standing, hook, stage: "reveal", m1: {}, vote: null, slot: null, poked: false, run: s.run + 1 })); scrollTop(); }} />;
  else if (state.stage === "reveal") screen = <GroupReveal {...props} />;
  else if (state.stage === "intros") screen = <CrewChat {...props} />;
  else if (state.stage === "meeting1") screen = <Meeting1 {...props} session={session} />;
  else if (state.stage === "after1") screen = <AfterMeeting1 {...props} />;
  else if (state.stage === "between") screen = <BetweenMeetings {...props} />;
  else if (state.stage === "meeting2") screen = <Meeting2 {...props} />;
  else screen = <CheckIn game={game} personas={personas} live={!!state.live} code={state.code} sessionCode={session?.code} token={session?.token} />;

  const usingDemo = !LIVE && !state.answers && state.stage !== "onboarding" && state.view === "app";
  const where = state.stage === "gate" ? "You" : state.view === "app" ? `${Math.max(stageIndex, 0) + 1}/${STAGES.length} · ${STAGES[stageIndex]?.[1] || ""}` : state.view === "results" ? "Results" : "Tests";
  return (
    <div className="flex-1 flex flex-col">
      <header className="sticky z-40 text-white" style={{ top: "env(safe-area-inset-top, 0px)", background: "var(--header)" }}>
        <div className="max-w-[560px] mx-auto gutter h-14 flex items-center justify-between gap-3">
          <button onClick={() => go(state.live ? (session ? "reveal" : "gate") : "onboarding")} className="rt-display font-extrabold text-xl flex items-center gap-2 cursor-pointer text-white"><span aria-hidden="true">🍓</span>{APP_NAME}</button>
          <span className="text-xs sm:text-sm font-semibold text-white/80 truncate">{state.code ? `${state.code} · ` : ""}{where}</span>
        </div>
      </header>
      {usingDemo && <div className="bg-[var(--gold)] text-[var(--on-gold)] text-sm text-center py-1.5 font-semibold gutter">Using demo answers. Do onboarding to use yours.</div>}
      {state.noOverlap && !state.live && state.view === "app" && <div className="bg-[var(--blue)] text-white text-sm text-center py-1.5 font-semibold gutter">No-overlap path: the personas always picked the other vibe</div>}
      {state.gateError && state.stage === "gate" && <div className="bg-[var(--gold)] text-[var(--on-gold)] text-sm text-center py-1.5 font-semibold gutter">{state.gateError}</div>}
      <main key={`${state.stage}-${state.view}-${state.run}`} className="flex-1 flex flex-col">{screen}</main>
      {!LIVE && <DemoNav state={state} go={go} setView={setView} reset={() => { store.remove(STATE_KEY); setState({ ...INITIAL, run: state.run + 1 }); scrollTop(); }} toggleFallback={() => update((s) => ({ noOverlap: !s.noOverlap }))} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("rt-root")).render(<App />);
</script>

<script>
(function boot() {
  if (!window.React || !window.ReactDOM || !window.Babel) return setTimeout(boot, 50);
  try {
    var src = document.getElementById("rt-src").textContent;
    var code = Babel.transform(src, { presets: ["react"] }).code;
    new Function(code)();
  } catch (e) {
    var root = document.getElementById("rt-root");
    root.innerHTML = "";
    var pre = document.createElement("pre");
    pre.className = "gutter";
    pre.style.cssText = "color:var(--danger);white-space:pre-wrap;font-size:13px;padding-block:24px";
    pre.textContent = "Strawberry failed to start: " + (e && e.message || e);
    root.appendChild(pre);
  }
})();
</script>
</body>
</html>
